name: tests

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: syntax gate over every script
        run: python3 -c "import ast, glob; [ast.parse(open(f).read()) for f in glob.glob('bin/*.py')]"
      - name: unit + end-to-end regression (demo app, offline)
        run: python3 -m unittest discover -s tests -v
      - name: doctor
        run: RH_HOME=/tmp/rh_ci python3 bin/rh_doctor.py
